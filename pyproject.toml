[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "llmwiki"
description = "Cost-effective multimodal research knowledge base: immutable raw/ sources compiled into an interlinked wiki/, with hybrid wiki-first + RAG retrieval."
dynamic = ["version"]
# The library targets 3.11+; the pinned development interpreter is in
# .python-version, and [tool.mypy] python_version must match it.
requires-python = ">=3.11"
dependencies = [
    "anthropic>=1.0",
    "boto3",
    "fastapi",
    "fastmcp",
    "httpx",
    "langchain-core>=0.3",
    "langchain-openai",
    "langchain-google-genai",
    "langchain-nvidia-ai-endpoints",
    "langchain-deepseek",
    "langchain-openrouter",
    # Phase 1-D (2026-09-16): the query agent is a LangGraph StateGraph
    # (agent/graph.py) and its optional web-search tool uses the LangChain
    # Tavily integration (websearch/tavily.py, imported only in factory).
    "langgraph>=1.0",
    "langchain-tavily",
    "numpy",
    "pydantic>=2",
    "pydantic-settings",
    "pymupdf",
    "python-dotenv",
    "python-frontmatter",
    "trafilatura",
    "uvicorn",
    "youtube-transcript-api",
]

[project.optional-dependencies]
# Anthropic is native (llm/anthropic_client.py - prompt caching, measured USD
# cost); every other provider goes through LangChain. As of 2026-09-09 all of
# them - langchain-core and every provider integration above - are core
# dependencies, not extras: `pip install llmwiki` / `uv sync` installs every
# provider, and switching LLM_PROVIDER needs no separate install step.
# llm/providers.py still imports each provider SDK lazily (inside build()), so
# importing the registry stays cheap even though the packages are on disk.

# Optional tracing. Independent of which LLM_PROVIDER is chosen: it wraps the
# native Anthropic adapter directly and is picked up automatically by every
# LangChain provider's own instrumentation. Off (LANGSMITH_TRACING=false) costs
# nothing and imports nothing - see llm/anthropic_client.py and factory.py.
langsmith = ["langsmith>=0.3"]

# langsmith is a dev dependency so the tracing-wrap test can monkeypatch it
# without requiring LANGSMITH_TRACING=true.
dev = ["pytest", "pytest-mock", "pytest-asyncio", "mypy", "ruff", "respx",
       "langsmith>=0.3"]

[project.scripts]
llmwiki = "llmwiki.cli:main"

[tool.setuptools.dynamic]
version = {attr = "llmwiki.__version__"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
llmwiki = ["py.typed", "chains/prompts/*.md"]

[tool.pytest.ini_options]
# The repo root on sys.path, so `tests.doubles` imports under a bare `pytest`
# and not only under `python -m pytest`, which adds the cwd itself.
pythonpath = ["."]
markers = ["integration: hits real external services; opt in with -m integration"]
addopts = "-m 'not integration'"
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.mypy]
files = ["src/llmwiki"]
python_version = "3.11"
disallow_untyped_defs = true
ignore_missing_imports = true

[tool.ruff]
line-length = 100
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# Depends()/File()/Form() in argument defaults is how FastAPI declares
# dependencies; B008 is a false positive on every FastAPI route module.
"src/llmwiki/api/routes.py" = ["B008"]
